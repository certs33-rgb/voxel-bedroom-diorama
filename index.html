<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   1. RENDERER / SCENE / CAMERA
   ============================================================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060c);
scene.fog = new THREE.FogExp2(0x070b14, 0.010);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 220);
const START_POS = new THREE.Vector3(13, 11, 15);   // elevated 3/4 from the open corner
const TARGET    = new THREE.Vector3(0, 4, 0);      // room center
camera.position.copy(START_POS);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;      // slow: ~2 min per revolution
controls.minDistance = 9;
controls.maxDistance = 42;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = 1.52;       // stay above the floor
controls.update();

/* ============================================================
   2. SEEDED RNG (deterministic scene)
   ============================================================ */
let _s = 1337;
const rnd  = () => (_s = (_s * 1664525 + 1013904223) >>> 0) / 4294967296;
const rndi = (a,b) => a + Math.floor(rnd()*(b-a+1));
const pick = a => a[Math.floor(rnd()*a.length)];
const smooth = (a,b,x) => { const t = THREE.MathUtils.clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

/* ============================================================
   3. VOXEL BUILDER  (three instanced pools: lit, emissive, small-glow)
   ============================================================ */
const diorama = new THREE.Group();
scene.add(diorama);

const solid = [], glow = [], glowS = [];
function V(x,y,z,col,type=0){
  const c = col instanceof THREE.Color ? col : new THREE.Color(col);
  (type===1 ? glow : type===2 ? glowS : solid).push([x,y,z,c]);
}
function BOX(x0,y0,z0,x1,y1,z1,col,jit=0){
  const base = new THREE.Color(col);
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)
    V(x,y,z, jit ? base.clone().multiplyScalar(1+(rnd()*2-1)*jit) : base);
}
function thin(sx,sy,sz, px,py,pz, col, mat, rotY=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), mat || new THREE.MeshLambertMaterial({color:col}));
  m.position.set(px,py,pz);
  if(rotY) m.rotation.y = rotY;
  diorama.add(m); return m;
}
function makeTex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

/* ============================================================
   4. ROOM SHELL  (cutaway: back + left walls only, no ceiling)
      room: x -8..7, z -6..5, walls rows y 1..9, floor surface y=1
   ============================================================ */
const P = {
  plinth:0x10141f, floor:0x242e46, floor2:0x2a3450, wet:0x3c4c72,
  wall:0x3c445c, wall2:0x333c54, trim:0x1a2030, frame:0x4d5878,
  metal:0x4c567a, desk:0x455170, desk2:0x505e82,
  duvet:0x35597e, duvetD:0x2a4566, duvetL:0x436a9c,
  pillow:0xcfb98f, pillowD:0xbfa87e, sheet:0x9fd4e8, mattress:0x9aa3b2,
};

// diorama plinth
BOX(-9,-1,-7, 8,-1,6, P.plinth);

// floor (two-tone + wet sheen patches near window)
for(let x=-8;x<=7;x++)for(let z=-6;z<=5;z++){
  let c = (x+z)%2===0 ? P.floor : P.floor2;
  if(x>=-6&&x<=3&&z>=-5&&z<=-3&&rnd()<0.35) c = P.wet;
  V(x,0,z, new THREE.Color(c).multiplyScalar(1+(rnd()*2-1)*0.05));
}

// back wall z=-6 ; window opening x -6..3, rows y 3..6
for(let y=1;y<=9;y++)for(let x=-8;x<=7;x++){
  if(y>=3&&y<=6&&x>=-6&&x<=3) continue;
  const c = rnd()<0.08 ? 0x2e3852 : P.wall;           // weathering
  V(x,y,-6, new THREE.Color(c).multiplyScalar(1+(rnd()*2-1)*0.06));
}
// left wall x=-8
for(let y=1;y<=9;y++)for(let z=-6;z<=5;z++){
  const c = rnd()<0.08 ? 0x283248 : P.wall2;
  V(-8,y,z, new THREE.Color(c).multiplyScalar(1+(rnd()*2-1)*0.06));
}

// cutaway caps + baseboards
thin(16.6,0.35,0.35, 0, 9.85, -6.1, P.trim);
thin(0.35,0.35,12.6, -8.1, 9.85, 0, P.trim);
thin(16,0.35,0.3, 0, 1.18, -5.85, P.trim);
thin(0.3,0.35,12, -7.85, 1.18, 0, P.trim);

// window frame
thin(9.5,0.3,0.5, -1.5, 2.85, -5.85, P.frame);   // sill
thin(9.5,0.3,0.35, -1.5, 7.15, -5.9, P.frame);   // head
thin(0.3,4.6,0.35, -6.1, 5, -5.9, P.frame);      // left
thin(0.3,4.6,0.35, 3.1, 5, -5.9, P.frame);       // right

// blinds (angled slats)
const slatMat = new THREE.MeshLambertMaterial({color:0x1c2334});
[3.8,4.8,5.8,6.6].forEach(y=>{
  const s = new THREE.Mesh(new THREE.BoxGeometry(9.2,0.09,0.3), slatMat);
  s.position.set(-1.5, y, -5.8); s.rotation.x = -0.4; diorama.add(s);
});

// glass pane (subtle gradient, unlit)
const glassTex = makeTex(64,64,(ctx,w,h)=>{
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(150,225,255,0.12)');
  g.addColorStop(0.5,'rgba(150,225,255,0.04)');
  g.addColorStop(1,'rgba(150,225,255,0.08)');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
});
const glass = new THREE.Mesh(new THREE.PlaneGeometry(9.2,4.2),
  new THREE.MeshBasicMaterial({map:glassTex, transparent:true, depthWrite:false}));
glass.position.set(-1.5,5,-5.92); diorama.add(glass);

// exposed conduits
thin(0.16,3.5,0.16, 7.3, 2.7, -5.85, P.metal);
thin(0.3,0.4,0.3, 7.3, 4.5, -5.8, P.metal);
thin(0.16,0.16,3, -7.05, 8.6, 1, P.metal);
thin(0.3,0.4,0.3, -7.0, 8.6, 2.6, P.metal);

// door on left wall (with keypad glow)
thin(0.26,6.3,2.2, -7.07, 4.15, 4, P.trim);
thin(0.22,6,2, -7.05, 4, 4, 0x3c4668);
thin(0.1,0.5,0.3, -6.9, 4, 4.5, 0x2b6f80, new THREE.MeshBasicMaterial({color:0x2b6f80}));

// shelf on left wall
thin(0.5,0.16,2.6, -7.25, 5, -3, P.desk);
thin(0.4,0.5,0.4, -7.3, 5.35, -3.8, 0x4a3b52);
thin(0.4,0.4,0.4, -7.3, 5.28, -2.9, 0x2b6f80, new THREE.MeshBasicMaterial({color:0x2b6f80}));
thin(0.45,0.45,0.45, -7.3, 5.25, -2.2, 0x8a4a52);

// poster on left wall
const posterTex = makeTex(256,320,(ctx,w,h)=>{
  ctx.fillStyle='#12141c'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#2b6f80'; ctx.lineWidth=3; ctx.strokeRect(10,10,w-20,h-20);
  ctx.strokeStyle='#67e8f9'; ctx.lineWidth=4; ctx.shadowColor='#67e8f9'; ctx.shadowBlur=16;
  ctx.beginPath(); ctx.ellipse(w/2,120,70,40,0,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#d16ba5'; ctx.shadowColor='#d16ba5';
  ctx.beginPath(); ctx.arc(w/2,120,18,0,Math.PI*2); ctx.fill();
  ctx.font='bold 34px monospace'; ctx.textAlign='center'; ctx.shadowBlur=12;
  ctx.fillText('DREAMS', w/2, 220);
  ctx.fillStyle='#5a7a8a'; ctx.shadowBlur=0; ctx.font='12px monospace';
  ctx.fillText('REPLICANT SERIES 2', w/2, 260);
  ctx.fillText('APPROVED DREAMS ONLY', w/2, 278);
  ctx.fillStyle='rgba(0,0,0,0.25)';
  for(let y=0;y<h;y+=6) ctx.fillRect(0,y,w,2);
});
const poster = new THREE.Mesh(new THREE.PlaneGeometry(2.4,3),
  new THREE.MeshBasicMaterial({map:posterTex}));
poster.position.set(-6.96, 5.5, 1.5);
poster.rotation.y = Math.PI/2;
diorama.add(poster);

/* ============================================================
   5. BED  (x -7..-3, z -4..-1)  + nightstand + lamp
   ============================================================ */
BOX(-7,1,-4, -7,4,-1, 0x3c4662, 0.05);        // headboard
BOX(-6,1,-4, -3,2,-1, P.metal, 0.05);         // frame
BOX(-6,3,-4, -3,3,-1, P.mattress, 0.04);      // mattress
BOX(-3,4,-4, -3,4,-1, P.sheet, 0.05);         // sheet at foot
BOX(-5,4,-4, -4,4,-1, P.duvet, 0.06);         // duvet
for(let i=0;i<14;i++){                          // rumpled folds
  const x=rndi(-5,-4), z=rndi(-4,-1);
  V(x,5,z, rnd()<0.5 ? P.duvetD : P.duvetL);
}
BOX(-4,5,-3, -4,5,-2, P.duvetL);               // bunched blanket
V(-3,5,-3, P.duvetL); V(-3,5,-2, P.duvet);
BOX(-6,4,-4, -6,4,-3, P.pillow, 0.05);         // pillows
V(-6,5,-4, P.pillowD); V(-6,5,-3, P.pillow);
V(-2,1,-1, 0x8a4a52);                          // stray sock

// nightstand + exposed-bulb lamp
BOX(-7,1,-5, -6,3,-4, P.desk, 0.05);
thin(0.7,0.25,0.7, -6.5, 4.12, -4.5, 0x8a6a3f);
thin(0.2,0.8,0.2, -6.5, 4.65, -4.5, 0x6a5233);
const bulb = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.55,0.55),
  new THREE.MeshBasicMaterial({color:0xffd9a0}));
bulb.position.set(-6.5, 5.35, -4.5); diorama.add(bulb);
const lampLight = new THREE.PointLight(0xffc080, 2.4, 14, 2);
lampLight.position.set(-6.5, 5.5, -4.2); diorama.add(lampLight);

/* ============================================================
   6. DESK  (x 4..6, z -5..-3)  + terminal + cables + chair
   ============================================================ */
[[4,-5],[6,-5],[4,-4],[6,-4]].forEach(([x,z])=>BOX(x,1,z,x,2,z,0x38425e));
BOX(4,3,-5, 6,3,-4, P.desk, 0.04);             // desktop

// monitor (frame + live canvas screen)
BOX(4,4,-5, 5,6,-5, 0x2f3854, 0.03);
const tcv = document.createElement('canvas'); tcv.width=128; tcv.height=160;
const tctx = tcv.getContext('2d');
const tTex = new THREE.CanvasTexture(tcv); tTex.colorSpace = THREE.SRGBColorSpace;
const tLines = ['> rain 84% / 17C','> uplink ORACLE-7','> mem-seed 0x4F2A ok','> replicant db 4091','> coffee: LOW','> dream buffer 62%','> city temp 19C','> sleep: 0h 42m','> jack-in ready','> ads: 12 pending'];
let tLineIdx = 0;
function drawTerm(){
  tctx.fillStyle='#031016'; tctx.fillRect(0,0,128,160);
  tctx.fillStyle='#ffb454'; tctx.font='bold 11px monospace';
  tctx.fillText('ORACLE-7 // NIGHT',6,14);
  tctx.fillStyle='#2b4a5a'; tctx.fillRect(0,20,128,1);
  tctx.font='10px monospace';
  for(let i=0;i<11;i++){
    const s = tLines[(tLineIdx+i)%tLines.length];
    tctx.fillStyle = i===10 ? '#c9f6ff' : (i%2 ? '#57b8cc' : '#3a8a9e');
    tctx.fillText(s,6,36+i*12);
  }
  if(Math.floor(performance.now()/400)%2===0){
    const last = tLines[tLineIdx%tLines.length];
    tctx.fillStyle='#c9f6ff';
    tctx.fillRect(6+tctx.measureText(last).width+2, 148, 6, 10);
  }
  tctx.fillStyle='rgba(0,0,0,0.22)';
  for(let y=0;y<160;y+=4) tctx.fillRect(0,y,128,1);
  tTex.needsUpdate=true;
}
drawTerm();
const screenMat = new THREE.MeshBasicMaterial({map:tTex});
const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.8,2.2), screenMat);
screen.position.set(5,5.5,-3.98); diorama.add(screen);
const haloMat = new THREE.MeshBasicMaterial({color:0x67e8f9, transparent:true, opacity:0.07, blending:THREE.AdditiveBlending, depthWrite:false});
const halo = new THREE.Mesh(new THREE.PlaneGeometry(2.5,2.9), haloMat);
halo.position.set(5,5.5,-3.95); diorama.add(halo);
const termLight = new THREE.PointLight(0x67e8f9, 1.6, 12, 2);
termLight.position.set(5,5.5,-2.5); diorama.add(termLight);

// keyboard + tower
thin(1.7,0.18,0.7, 5, 4.1, -3.5, 0x242c40);
thin(1.5,0.03,0.06, 5, 4.21, -3.2, 0x2b6f80, new THREE.MeshBasicMaterial({color:0x2b6f80}));
BOX(6,4,-5, 6,5,-5, 0x2f3854, 0.03);
thin(1.05,0.25,0.06, 6.5, 4.5, -3.97, 0x2b6f80, new THREE.MeshBasicMaterial({color:0x2b6f80}));

// coffee cup
thin(0.5,0.55,0.5, 6.4, 4.28, -3.4, 0x8a4a52);

// exposed cables
thin(0.14,0.14,0.8, 5, 4.05, -4.55, 0x1e2638);
thin(0.14,3,0.14, 5, 2.5, -5.85, 0x1e2638);
thin(0.14,3,0.14, 6.95, 2.5, -3.2, 0x1e2638);
thin(0.14,0.14,1.6, 6.95, 1.07, -2.4, 0x1e2638);

// worn chair (x 5..6, z -2..-1)
[[5,-2],[6,-2],[5,-1],[6,-1]].forEach(([x,z])=>V(x,1,z,0x2f3854));
BOX(5,2,-2, 6,2,-1, 0x3a3550, 0.06);
V(6,2,-1, 0x3a3448);
BOX(5,3,-2, 6,5,-2, 0x3a3550, 0.06);
V(6,5,-2, 0x2f3854);           // torn corner, frame showing
V(5,5,-2, 0x4a3b52);           // jacket draped
V(6,4,-2, 0x443650);

/* ============================================================
   7. CLUTTER  (rug, plant, bin, books)
   ============================================================ */
thin(4.4,0.14,3.4, 1, 1.07, 1.5, 0x4a2a3a);
thin(3.6,0.16,2.6, 1, 1.08, 1.5, 0x5a3448);

// neglected plant (x -6..-5, z 3..4)
BOX(-6,1,3, -5,1,4, 0x7a4a3a, 0.08);
BOX(-6,2,3, -5,2,4, 0x362a1e);
thin(1.9,0.2,1.9, -5.5, 2.15, 3.5, 0x6a4234);
const stemCols=[0x3f6b4a,0x5a7a4a,0x6a5a3a,0x4a6a42];
for(let i=0;i<4;i++){
  const x=-6+(i%2), z=3+Math.floor(i/2);
  const h=2+Math.floor(rnd()*2.5);
  const st = thin(0.16,h,0.16, x+0.5+(rnd()-0.5)*0.3, 2.2+h/2, z+0.5+(rnd()-0.5)*0.3, pick(stemCols));
  st.rotation.z = (rnd()-0.5)*0.3;
  const leafC = rnd()<0.4 ? 0x8a7a4a : 0x4a7a52;   // brown tips = neglected
  V(x, 2+h, z, leafC);
  if(rnd()<0.5) V(x, 2+h+1, z, 0x6a7a4a);
}

// bin + crumpled paper
BOX(7,1,-2, 7,2,-2, 0x2f3854, 0.05);
thin(0.4,0.3,0.4, 7.2, 2.25, -2.1, 0x8a93a5);

// books on floor
thin(0.9,0.16,0.6, -4.5, 1.1, 4.0, 0x4a3b52);
thin(0.8,0.16,0.55, -4.2, 1.28, 4.2, 0x2b4a6b);
thin(0.7,0.16,0.5, -4.4, 1.46, 4.1, 0x8a4a52, null, 0.4);

/* ============================================================
   8. CITY BACKDROP  (attached to diorama group)
   ============================================================ */
const skyTex = makeTex(256,128,(ctx,w,h)=>{
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#0b1626'); g.addColorStop(0.5,'#0a1220');
  g.addColorStop(0.62,'#16324a'); g.addColorStop(0.8,'#0a1220'); g.addColorStop(1,'#05070d');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  for(let i=0;i<40;i++){
    ctx.fillStyle='rgba(200,230,255,'+(0.05+rnd()*0.25).toFixed(2)+')';
    ctx.fillRect(rnd()*w, rnd()*h*0.5, 1, 1);
  }
});
const sky = new THREE.Mesh(new THREE.PlaneGeometry(70,26),
  new THREE.MeshBasicMaterial({map:skyTex, fog:false}));
sky.position.set(0,7,-19); diorama.add(sky);

const cground = new THREE.Mesh(new THREE.PlaneGeometry(70,10),
  new THREE.MeshLambertMaterial({color:0x0d1220}));
cground.rotation.x = -Math.PI/2; cground.position.set(0,0.95,-13); diorama.add(cground);
const sheen = new THREE.Mesh(new THREE.PlaneGeometry(70,10),
  new THREE.MeshBasicMaterial({color:0x3a6a8a, transparent:true, opacity:0.07, blending:THREE.AdditiveBlending, depthWrite:false}));
sheen.rotation.x = -Math.PI/2; sheen.position.set(0,1.0,-13); diorama.add(sheen);

// hero towers (fixed, carry the neon signs)
[[ -12,15,-14,4],[ 0,12,-16,4],[ 14,16,-13,4 ]].forEach(([tx,th,tz,tw])=>{
  for(let xx=tx;xx<tx+tw;xx++)for(let y=0;y<th;y++){
    const edge = xx===tx||xx===tx+tw-1||y===0||y===th-1;
    if(!edge && rnd()<0.1){
      const rr=rnd();
      V(xx,y,tz, new THREE.Color(rr<0.5?0x67e8f9: rr<0.75?0xffb454: rr<0.9?0xd16ba5: 0xdfe9f5)
        .multiplyScalar(0.45+rnd()*0.35), 2);
    } else {
      V(xx,y,tz, new THREE.Color(0x141a28).multiplyScalar(1+(rnd()*2-1)*0.06));
    }
  }
});

// random towers (keep clear of hero x-ranges)
for(let i=0;i<14;i++){
  const w=rndi(3,7), h=rndi(6,18), tz=rndi(-17,-11);
  let tx; const r=rnd();
  if(r<0.4)      tx=rndi(-26, -14-w);
  else if(r<0.8) tx= rnd()<0.5 ? rndi(-8, -1-w+1) : rndi(5, 11-w+1);
  else           tx=rndi(18, 24-w+1);
  for(let xx=tx;xx<tx+w;xx++)for(let y=0;y<h;y++){
    const edge = xx===tx||xx===tx+w-1||y===0||y===h-1;
    if(!edge && rnd()<0.22){
      const rr=rnd();
      V(xx,y,tz, new THREE.Color(rr<0.5?0x67e8f9: rr<0.75?0xffb454: rr<0.9?0xd16ba5: 0xdfe9f5)
        .multiplyScalar(0.5+rnd()*0.4), 2);
    } else {
      V(xx,y,tz, new THREE.Color(0x141a28).multiplyScalar(1+(rnd()*2-1)*0.08));
    }
  }
}

// neon signs (canvas glow on tower faces)
function signTex(text,color,wpx,hpx,vertical){
  return makeTex(wpx,hpx,(ctx,w,h)=>{
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=14;
    ctx.font='bold '+(vertical? Math.floor(h/(text.length+1)*0.75) : Math.floor(h*0.6))+'px monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(vertical){ for(let i=0;i<text.length;i++) ctx.fillText(text[i], w/2, h*(i+0.9)/(text.length+0.2)); }
    else ctx.fillText(text, w/2, h/2);
  });
}
function signMesh(tex, sw, sh, px,py,pz){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(sw,sh),
    new THREE.MeshBasicMaterial({map:tex, transparent:true, fog:false}));
  m.position.set(px,py,pz); diorama.add(m); return m;
}
signMesh(signTex('RACHAEL','#d16ba5',128,448,true),  1.6,6,   -10.5, 8, -12.94);
signMesh(signTex('ZORBA','#ffb454',256,96,false),     3,1.1,    2, 9, -14.94);
signMesh(signTex('KOWLOON','#67e8f9',128,512,true),   1.5,6.5,  16, 8, -11.94);

/* ============================================================
   9. FLYING TRAFFIC + SWEEPING LIGHT BEAM
   ============================================================ */
const shipDefs=[
  {x:-20, dir:1,  speed:2.0, y:12,   z:-13,   ph:0},
  {x:10,  dir:-1, speed:1.5, y:9.5,  z:-15.5, ph:1.3},
  {x:-5,  dir:1,  speed:1.1, y:14.5, z:-11.5, ph:2.1},
  {x:22,  dir:-1, speed:2.6, y:7.5,  z:-16.5, ph:3.7},
  {x:-25, dir:1,  speed:1.8, y:16,   z:-18,   ph:4.2},
];
const ships = shipDefs.map(d=>{
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.35,0.35), new THREE.MeshLambertMaterial({color:0x242e44}));
  const nose=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.18,0.18), new THREE.MeshBasicMaterial({color:0xdfe9f5}));
  nose.position.x=0.85;
  const tail=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.14,0.14), new THREE.MeshBasicMaterial({color:0xd16ba5}));
  tail.position.x=-0.8;
  g.add(body,nose,tail);
  if(d.dir<0) g.rotation.y=Math.PI;
  diorama.add(g);
  return {...d, g};
});

// beam: from passing ship through the window onto the room floor
const beamGeo=new THREE.PlaneGeometry(1,1); beamGeo.translate(0,0.5,0);
const beamMat=new THREE.MeshBasicMaterial({color:0xbfe9ff, transparent:true, opacity:0,
  blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide});
const beam=new THREE.Mesh(beamGeo, beamMat);
beam.renderOrder=11; diorama.add(beam);
const UP=new THREE.Vector3(0,1,0);
const _S=new THREE.Vector3(), _T=new THREE.Vector3(), _dir=new THREE.Vector3();
function updBeam(){
  const s=ships[0];
  _S.set(s.x, s.g.position.y, s.z);
  _T.set(THREE.MathUtils.clamp(s.x*0.35,-4,2), 1.05, -1.0);
  _dir.copy(_T).sub(_S);
  const len=_dir.length();
  beam.position.copy(_S).add(_T).multiplyScalar(0.5);
  beam.scale.set(1.1, len, 1);
  beam.quaternion.setFromUnitVectors(UP, _dir.normalize());
  const k=smooth(-6.5,-3.5,s.x)*(1-smooth(0,3,s.x));   // visible while crossing the window
  beamMat.opacity=0.12*k;
  beam.visible=k>0.02;
}

/* ============================================================
   10. RAIN (city) + DROPLETS (on glass)
   ============================================================ */
const RN=260;
const rpos=new Float32Array(RN*6), rdat=[];
for(let i=0;i<RN;i++) rdat.push({x:-16+Math.random()*28, z:-8.5-Math.random()*9, y:Math.random()*16, sp:10+Math.random()*7});
const rgeo=new THREE.BufferGeometry();
rgeo.setAttribute('position', new THREE.BufferAttribute(rpos,3));
const rain=new THREE.LineSegments(rgeo, new THREE.LineBasicMaterial({color:0x9fc7dd, transparent:true, opacity:0.2, blending:THREE.AdditiveBlending, depthWrite:false}));
diorama.add(rain);
function updRain(dt){
  for(let i=0;i<RN;i++){
    const d=rdat[i]; d.y-=d.sp*dt; if(d.y<0.5) d.y=15+Math.random()*2;
    const o=i*6;
    rpos[o]=d.x; rpos[o+1]=d.y; rpos[o+2]=d.z;
    rpos[o+3]=d.x; rpos[o+4]=d.y+1.2; rpos[o+5]=d.z;
  }
  rgeo.attributes.position.needsUpdate=true;
}

const DN=14;
const dpos=new Float32Array(DN*6), ddat=[];
for(let i=0;i<DN;i++) ddat.push({x:-5.6+Math.random()*8.4, y:3.2+Math.random()*3.6, sp:0.35+Math.random()*0.5});
const dgeo=new THREE.BufferGeometry();
dgeo.setAttribute('position', new THREE.BufferAttribute(dpos,3));
const drops=new THREE.LineSegments(dgeo, new THREE.LineBasicMaterial({color:0xbfe4f5, transparent:true, opacity:0.3, depthWrite:false}));
diorama.add(drops);
function updDrops(dt){
  for(let i=0;i<DN;i++){
    const d=ddat[i]; d.y-=d.sp*dt; if(d.y<3.1) d.y=6.9;
    const o=i*6;
    dpos[o]=d.x; dpos[o+1]=d.y; dpos[o+2]=-5.83;
    dpos[o+3]=d.x; dpos[o+4]=d.y+0.5; dpos[o+5]=-5.83;
  }
  dgeo.attributes.position.needsUpdate=true;
}

/* ============================================================
   11. FAKE VOLUMETRICS  (blind bands, floor spill, lamp pool)
   ============================================================ */
function band(wy, fz, col, op){
  const v=new Float32Array([
    -5.9,wy,-5.88,   3.1,wy,-5.88,   3.5,1.03,fz,
    -5.9,wy,-5.88,   3.5,1.03,fz,   -5.5,1.03,fz,
  ]);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(v,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:op,
    blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
  m.renderOrder=10; diorama.add(m);
}
band(4.3, 0.5, 0x7fe9ff, 0.07);
band(5.3, 0.9, 0x9fd4e8, 0.05);
band(6.3, 1.3, 0xbfe9ff, 0.04);

const spillTex=makeTex(128,64,(ctx,w,h)=>{
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(127,233,255,0.6)'); g.addColorStop(1,'rgba(127,233,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
});
const spill=new THREE.Mesh(new THREE.PlaneGeometry(9,4.5),
  new THREE.MeshBasicMaterial({map:spillTex, transparent:true, opacity:0.06, blending:THREE.AdditiveBlending, depthWrite:false}));
spill.rotation.x=-Math.PI/2; spill.position.set(-1.5,1.02,-3.2); spill.renderOrder=9; diorama.add(spill);

const lampTex=makeTex(128,128,(ctx,w,h)=>{
  const g=ctx.createRadialGradient(64,64,4,64,64,60);
  g.addColorStop(0,'rgba(255,180,84,0.55)'); g.addColorStop(1,'rgba(255,180,84,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
});
const lampPool=new THREE.Mesh(new THREE.PlaneGeometry(4,4),
  new THREE.MeshBasicMaterial({map:lampTex, transparent:true, opacity:0.11, blending:THREE.AdditiveBlending, depthWrite:false}));
lampPool.rotation.x=-Math.PI/2; lampPool.position.set(-6.5,1.03,-3.4); lampPool.renderOrder=9; diorama.add(lampPool);

/* ============================================================
   12. LIGHTS
   ============================================================ */
scene.add(new THREE.HemisphereLight(0x6a8ab8, 0x1a2030, 2.0));
scene.add(new THREE.AmbientLight(0x2a3448, 1.0));
const fill=new THREE.PointLight(0x7ac8e8, 1.6, 18, 2);
fill.position.set(0,5,-3); diorama.add(fill);

/* ============================================================
   13. INSTANCE MESHES  (3 draw calls for all cubes)
   ============================================================ */
function makeInstances(list, mat, scale=1){
  const m=new THREE.InstancedMesh(new THREE.BoxGeometry(scale,scale,scale), mat, list.length);
  const M=new THREE.Matrix4();
  for(let i=0;i<list.length;i++){
    M.setPosition(list[i][0]+0.5, list[i][1]+0.5, list[i][2]+0.5);
    m.setMatrixAt(i,M);
    m.setColorAt(i, list[i][3]);
  }
  m.instanceMatrix.needsUpdate=true;
  if(m.instanceColor) m.instanceColor.needsUpdate=true;
  diorama.add(m);
  return m;
}
makeInstances(solid, new THREE.MeshLambertMaterial({color:0xffffff}));
makeInstances(glow,  new THREE.MeshBasicMaterial({color:0xffffff}));
makeInstances(glowS, new THREE.MeshBasicMaterial({color:0xffffff}), 0.45);

/* ============================================================
   14. UI  (pause / resume, reset view)
   ============================================================ */
const pauseBtn=document.getElementById('pauseBtn');
const resetBtn=document.getElementById('resetBtn');
const pausedEl=document.getElementById('paused');
pauseBtn.onclick=()=>{
  controls.autoRotate=!controls.autoRotate;
  pauseBtn.textContent=controls.autoRotate?'\u275A\u275A PAUSE':'\u25B6 RESUME';
  pausedEl.style.display=controls.autoRotate?'none':'block';
};
resetBtn.onclick=()=>{
  camera.position.copy(START_POS);
  controls.target.copy(TARGET);
  controls.update();
};
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   15. MAIN LOOP
   ============================================================ */
const clock=new THREE.Clock();
let termAcc=0, fps=60, fpsAcc=0, fpsN=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(), 0.05);
  const t=clock.elapsedTime;
  controls.update();

  for(const s of ships){
    s.x+=s.dir*s.speed*dt;
    if(s.x>30)s.x=-30; if(s.x<-30)s.x=30;
    s.g.position.set(s.x, s.y+Math.sin(t*0.8+s.ph)*0.3, s.z);
  }
  updBeam();
  updRain(dt);
  updDrops(dt);

  termAcc+=dt;
  if(termAcc>0.13){ termAcc=0; tLineIdx++; drawTerm(); }
  const flick=(0.9+0.1*Math.sin(t*21)*Math.sin(t*6.7))*(Math.random()<0.015?0.55:1);
  screenMat.color.setScalar(flick);
  termLight.intensity=0.5+0.6*flick;
  haloMat.opacity=0.05+0.04*flick;

  fpsAcc+=dt; fpsN++;
  if(fpsAcc>0.5){ fps=Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0; }

  renderer.render(scene,camera);
}
loop();

/* test/debug surface */
window.__ready = true;
window.__three = { scene, diorama, renderer, camera, controls };
window.__dbg={
  get cam(){ return camera.position.toArray().map(n=>+n.toFixed(2)); },
  get target(){ return controls.target.toArray().map(n=>+n.toFixed(2)); },
  get autoRotate(){ return controls.autoRotate; },
  solid: solid.length, glow: glow.length,
  get fps(){ return fps; }
};
